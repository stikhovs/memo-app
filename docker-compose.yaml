version: '3.8'

services:
  app:
    image: registry.gitlab.com/memo7502116/memo-app:latest
    container_name: memo_app
    restart: unless-stopped
    env_file:
      - "env.list"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memo_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
